blueprint:
  name: JARVIS Media Easter Eggs
  description: Fun easter eggs that trigger responses the from the Iron Man movies for home assistant voice assistants.
  domain: automation
  input:
    target_satellite:
      name: Assist Satellite
      description: The speaker Audio will play on.
      selector:
        entity:
          filter:
            - domain: assist_satellite
triggers:
  - trigger: conversation
    command:
      - you there
      - jarvis you there
      - you're there
      - ya there
      - are you there
      - jarvis are you there
    id: you there
  - trigger: conversation
    command:
      - alright what do you say
      - alright what do you say jarvis
      - jarvis alright what do you say
      - what do you say
    id: alright what do you say
  - trigger: conversation
    command:
      - sometimes you got to run before you can walk
      - sometimes you gotta run before you can walk
      - jarvis sometimes you got to run before you can walk
      - jarvis sometimes you gotta run before you can walk
      - Sometimes you're going to run before you can walk
      - Sometimes you've got to run before you can walk
    id: sometimes you gotta run before you can walk
  - trigger: conversation
    command:
      - the truth is
      - the truth is i am iron man
      - jarvis the truth is i am iron man
      - jarvis the truth is
      - i am iron man
    id: the truth is i am iron man
  - trigger: conversation
    command:
      - drop my needle
    id: drop my needle
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - you there
        sequence:
          - set_conversation_response: ""
          - action: media_player.play_media
            metadata: {}
            data:
              media:
                media_content_id: media-source://media_source/media/iron_man_suit_setup.wav
                media_content_type: audio/x-wav
                metadata:
                  title: iron_man_suit_setup.wav
                  thumbnail: null
                  media_class: music
                  children_media_class: null
                  navigateIds:
                    - {}
                    - media_content_type: app
                      media_content_id: media-source://media_source
                  browse_entity_id: !input target_satellite
            target:
              entity_id: !input target_satellite
      - conditions:
          - condition: trigger
            id:
              - sometimes you gotta run before you can walk
        sequence:
          - set_conversation_response: ""
          - action: media_player.play_media
            metadata: {}
            data:
              media:
                media_content_id: media-source://media_source/media/iron_man_first_flight.wav
                media_content_type: audio/x-wav
                metadata:
                  title: iron_man_first_flight.wav
                  thumbnail: null
                  media_class: music
                  children_media_class: null
                  navigateIds:
                    - {}
                    - media_content_type: app
                      media_content_id: media-source://media_source
                  browse_entity_id: !input target_satellite
            target:
              entity_id: !input target_satellite
      - conditions:
          - condition: trigger
            id:
              - the truth is i am iron man
        sequence:
          - set_conversation_response: ""
          - action: media_player.play_media
            metadata: {}
            data:
              media:
                media_content_id: >-
                  media-source://media_source/media/the_truth_is_i_am_iron_man.wav
                media_content_type: audio/x-wav
                metadata:
                  title: the_truth_is_i_am_iron_man.wav
                  thumbnail: null
                  media_class: music
                  children_media_class: null
                  navigateIds:
                    - {}
                    - media_content_type: app
                      media_content_id: media-source://media_source
                  browse_entity_id: !input target_satellite
            target:
              entity_id: !input target_satellite
      - conditions:
          - condition: trigger
            id:
              - drop my needle
        sequence:
          - set_conversation_response: ""
          - action: music_assistant.play_media
            metadata: {}
            data:
              media_id: Jingle Bells (Bombay Dub Orchestra Remix)
              media_type: track
              enqueue: replace
            target:
              entity_id: !input target_satellite
mode: single