# Code inspired by WarLion, Amrut Prabhu, and George1422
# Still not 100% as of 1/19/26 but works very well.

substitutions:
  i2s_bclk: GPIO14
  i2s_lrclk: GPIO12
  microphone: GPIO13

  speaker: GPIO17
  i2s_bclk_speaker: GPIO15
  i2s_lrclk_speaker: GPIO16


esphome:
  name: esp-jarvis
  friendly_name: ESP Jarvis
  compile_process_limit: 7
  # on_boot: 
  #   priority: -600
  #   then:
  #     media_player.volume_set: 
  #       volume: 30%

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "adD57YaWN4hQ4HDsVvWv8cvrHPIjk17n5JrBj2x/R+8="
  on_client_connected:
    then:
      - delay: 50ms
      - micro_wake_word.start:

ota:
  - platform: esphome
    password: "bd7722b4db122ba2dbe26fdb1641ed90"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESP-Jarvis Fallback Hotspot"
    password: "ar7Xywgy1Ixu"

psram:
  mode: octal
  speed: 80MHz

captive_portal:

i2s_audio:
  - id: i2s_mic
    i2s_bclk_pin: ${i2s_bclk}
    i2s_lrclk_pin: ${i2s_lrclk}
  - id: i2s_speaker
    i2s_bclk_pin: ${i2s_bclk_speaker}
    i2s_lrclk_pin: ${i2s_lrclk_speaker}

# working well so far (dont change)
microphone:
- platform: i2s_audio
  # bits_per_sample: 16bit
  i2s_audio_id: i2s_mic
  id: mic
  i2s_din_pin: ${microphone}
  adc_type: external
  channel: left
  use_apll: true

speaker:
  - platform: i2s_audio
    id: big_speaker
    i2s_audio_id: i2s_speaker
    dac_type: external
    i2s_dout_pin: ${speaker}
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 100ms
    use_apll: true # very important for stability when playing media
    timeout: never # keeps the i2s bus occupied and ready

  - platform: mixer
    id: mixing_speaker
    output_speaker: big_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    id: media_speaker
    name: "Jarvis Speaker"
    buffer_size: 400000
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      # num_channels: 1
      # format: WAV
      format: FLAC     # FLAC is the least processor intensive codec
      sample_rate: 16000
    media_pipeline:
      speaker: media_resampling_speaker
      # num_channels: 1
      # format: WAV
      format: FLAC     # FLAC is the least processor intensive codec
      sample_rate: 48000

    # New: pause wake word during announcements
    on_announcement:
      # - micro_wake_word.stop:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.25s
    on_state:
      - delay: 0.7s
      - if:
          # condition:
          #   not:
          #     media_player.is_announcing:
          # then:
          #   - micro_wake_word.start:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.5s


micro_wake_word:
  id: mww
  stop_after_detection: false
  models:
    - model: hey_jarvis
      id: hey_jarvis
      internal: true
  vad:
    model: https://github.com/kahrendt/microWakeWord/releases/download/v2.1_models/vad.json
    probability_cutoff: 0.05
  on_wake_word_detected:
    - voice_assistant.start:
        # wake_word: !lambda return wake_word;


voice_assistant:
  id: assist
  microphone:
    microphone: mic
    # gain_factor: 40
  media_player: media_speaker
  volume_multiplier: 3.0
  noise_suppression_level: 2
  # auto_gain: 20dBFS

  # New: stop listening if it lingers too long
  on_listening:
    - script.execute: listening_timeout
  on_stt_vad_start:
    - script.stop: listening_timeout
  # on_client_connected:
  #   - if:
  #       condition:
  #         switch.is_on: mute
  #       then:
  #         - micro_wake_word.start

script:
  - id: listening_timeout
    mode: restart
    then:
      - delay: 6s            # try 4–6 s; tweak to taste
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:


switch:
  - platform: template
    id: mute
    name: mute
    optimistic: true
    on_turn_on: 
      - micro_wake_word.stop:
      - voice_assistant.stop:
    on_turn_off:
      - micro_wake_word.start: